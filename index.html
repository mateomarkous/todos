<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4f46e5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="To Do's">
<title>To Do's</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  html, body { margin: 0; height: 100%; background: #f4f4f5; overflow: hidden; }
  iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; background: #f4f4f5; }
  #splash { position: fixed; inset: 0; display: grid; place-items: center; background: #f4f4f5; color: #707075;
    font: 600 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; transition: opacity .3s; z-index: 2; }
  #splash img { width: 84px; height: 84px; border-radius: 20px; display: block; margin: 0 auto 14px; }
  #splash.hide { opacity: 0; pointer-events: none; }
  #msg { max-width: 300px; text-align: center; padding: 0 20px; }
  #msg a { color: #4f46e5; }
</style>
</head>
<body>
<div id="splash"><div id="msg"><img src="icon-192.png" alt="">Cargando…</div></div>
<script>
  const APP_URL = 'https://script.google.com/macros/s/AKfycbzLXztfOkS37IoFy6fD-d2sKaZmlbNdSs6fNRmrAiq3ojyke1uXooxMPFhSwizYObWX/exec';
  const splash = document.getElementById('splash'), msg = document.getElementById('msg');
  if (!navigator.onLine) {
    msg.innerHTML = '<img src="icon-192.png" alt="">Sin conexión. Conectate y volvé a abrir la app.';
  } else {
    const f = document.createElement('iframe');
    f.src = APP_URL + (location.search || '');
    f.allow = 'clipboard-write';
    f.onload = () => splash.classList.add('hide');
    document.body.appendChild(f);
    setTimeout(() => {
      if (!splash.classList.contains('hide')) {
        msg.innerHTML = '<img src="icon-192.png" alt="">Está tardando. Si no carga, <a href="' + APP_URL + '" target="_blank" rel="noopener">abrila en Chrome</a> una vez para iniciar sesión en Google y volvé a abrir la app.';
      }
    }, 15000);
  }
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
